name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  skins:
    name: Skin collection
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The manifest contract lives with the Server catalog that enforces it, in msime-windows; msime-windows runs the same tests against its pinned copy of this collection.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metasequoiaime/msime-windows
          ref: develop
          path: .skin-contract
          sparse-checkout: examples/skin-examples
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate every skin manifest and referenced asset
        working-directory: .skin-contract/examples/skin-examples
        env:
          MSIME_SKINS_DIR: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v
